services:
  mongodb:
    image: mongo:7
    container_name: dnd-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: dnd_app
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data: